# Broker MQTT Eclipse Mosquitto 2.x — configuration de développement / réseau interne.
# En production : n'exposer 1883 qu'à l'intérieur du cluster, ou activer
# `allow_anonymous false` + `password_file` (voir README, section Sécurité).
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
