services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/belhadjkhaoula03/borne-simulator:sha-e3614a7
    pull_policy: always
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - borne-data:/data
    restart: unless-stopped

volumes:
  borne-data:
