[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["business", "domaine", "infrastructure", "presentation"]
omit = ["infrastructure/mqtt_communication.py"]   # couvert par le test d'intégration (smoke test CI)

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
