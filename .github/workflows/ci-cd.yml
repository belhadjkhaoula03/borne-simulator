name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests et couverture
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Publication du rapport de couverture
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Image Docker + smoke test
    needs: test
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.ref.outputs.image }}
      pushed: ${{ steps.ref.outputs.pushed }}

    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Configuration Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construction de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: borne-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — stack complète
        env:
          APP_IMAGE: borne-simulator:ci
        run: |
          docker compose up -d --no-build
          bash ./scripts/smoke_test.sh

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêt de la stack
        if: always()
        run: docker compose down -v

      - name: Connexion à GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Génération des tags Docker
        id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publication de l'image Docker
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true

      - name: Référence immuable de l'image
        id: ref
        env:
          IMAGE: ${{ env.IMAGE }}
          PUSH: ${{ env.PUSH }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Déploiement Kubernetes
    needs: build
    if: needs.build.outputs.pushed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    environment: production

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      NAMESPACE: borne

    steps:
      - uses: actions/checkout@v4

      - name: Installation de kubectl
        uses: azure/setup-kubectl@v4

      - name: Configuration de l'accès au cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || {
            echo "Erreur : le secret KUBE_CONFIG est absent."
            exit 1
          }
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Injection de l'image construite
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: python3 scripts/set_image.py k8s/kustomization.yaml "$IMAGE_REF"

      - name: Validation des manifestes Kubernetes
        run: |
          kubectl kustomize k8s > /tmp/rendered.yaml
          grep -n "image:" /tmp/rendered.yaml

      - name: Application des manifestes
        run: kubectl apply -f /tmp/rendered.yaml

      - name: Attente du déploiement
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/mosquitto --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/borne-app --timeout=300s

      - name: Vérification de l'application et de la base SQLite
        run: |
          kubectl -n "$NAMESPACE" exec deploy/borne-app -- python -c '
          import json, time, urllib.request

          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/api/ready", timeout=3) as r:
                      ready = json.load(r)
                  with urllib.request.urlopen("http://127.0.0.1:8080/api/systeme", timeout=3) as r:
                      systeme = json.load(r)

                  total = sum(b["releves"] for b in systeme["base_de_donnees"]["bases"])

                  if ready["status"] == "ready" and ready["broker_connecte"] and total > 0:
                      print("Application prête")
                      print("Broker MQTT connecté :", ready["broker_connecte"])
                      print("Base de données :", systeme["base_de_donnees"]["moteur"])
                      for b in systeme["base_de_donnees"]["bases"]:
                          print(f"{b['fichier']}: {b['releves']} relevés")
                      break
              except Exception as e:
                  print(f"Vérification en attente : {e}")

              time.sleep(3)
          else:
              raise SystemExit("Application non prête ou base vide")
          '

      - name: Résumé du déploiement
        if: success()
        run: |
          {
            echo "### Déploiement réussi"
            echo "- Image : \`${{ needs.build.outputs.image }}\`"
            echo '```'
            kubectl -n "$NAMESPACE" get pods,svc -o wide
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" describe pods -l app.kubernetes.io/name=borne-app || true
          kubectl -n "$NAMESPACE" logs deploy/borne-app --tail=80 || true