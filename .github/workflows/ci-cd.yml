name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────── 1. Lint + tests unitaires
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests + couverture
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  # ─────────────────────────────── 2. Image Docker + smoke test (+ push GHCR)
  build:
    name: Image Docker + smoke test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      pushed: ${{ steps.ref.outputs.pushed }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image (GHCR exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image (chargée localement pour le smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: borne-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — stack complète (Mosquitto + app + SQLite)
        env:
          APP_IMAGE: borne-simulator:ci
        run: |
          docker compose up -d --no-build
          ./scripts/smoke_test.sh
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêt de la stack
        if: always()
        run: docker compose down -v

      - name: Login GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push de l'image (couches déjà en cache)
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true

      - name: Référence immuable de l'image (digest)
        id: ref
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "image=${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────────────────────── 3. Déploiement Kubernetes
  deploy:
    name: Déploiement Kubernetes
    needs: build
    if: needs.build.outputs.pushed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production        # protections / approbations configurables dans GitHub
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      NAMESPACE: borne
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Accès au cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Injection de l'image construite (digest immuable)
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: python3 scripts/set_image.py k8s/kustomization.yaml "$IMAGE_REF"

      - name: Application des manifestes
        run: |
          kubectl kustomize k8s > /tmp/rendered.yaml
          grep -n "image:" /tmp/rendered.yaml
          kubectl apply -f /tmp/rendered.yaml

      - name: Attente du déploiement
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/mosquitto --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/borne-app --timeout=300s

      - name: Vérification — application prête et base SQLite formée
        run: |
          kubectl -n "$NAMESPACE" exec -i deploy/borne-app -- python - <<'PY' | tee /tmp/verif.txt
          import glob, json, sqlite3, time, urllib.request
          for _ in range(40):                      # laisse le temps aux premiers relevés
              try:
                  ready = json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/ready", timeout=3))
                  s = json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/systeme", timeout=3))
                  total = sum(b["releves"] for b in s["base_de_donnees"]["bases"])
                  if ready["status"] == "ready" and ready["broker_connecte"] and total > 0:
                      break
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise SystemExit("application non prête ou base vide")
          db = s["base_de_donnees"]
          print(f"Base de données : {db['moteur']} {db['version']} ({db['organisation']})")
          for b in db["bases"]:
              print(f"  - {b['fichier']}: {b['releves']} relevés")
          print("Broker MQTT connecté :", ready["broker_connecte"])
          PY

      - name: Résumé du déploiement
        if: success()
        run: |
          {
            echo "### ✅ Déploiement réussi"
            echo "- Image : \`${{ needs.build.outputs.image }}\`"
            echo '```'; cat /tmp/verif.txt; echo '```'
            kubectl -n "$NAMESPACE" get pods,svc -o wide | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retour arrière automatique en cas d'échec
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" rollout undo deployment/borne-app || true
          kubectl -n "$NAMESPACE" describe pods -l app.kubernetes.io/name=borne-app | tail -40 || true
          kubectl -n "$NAMESPACE" logs deploy/borne-app --tail=80 || true
