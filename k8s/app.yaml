apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: borne-data
  labels: {app.kubernetes.io/part-of: borne}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: borne-app-config
data:
  MQTT_HOST: mosquitto
  MQTT_PORT: "1883"
  LOG_LEVEL: INFO
  DATA_DIR: /data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: borne-app
  labels: {app.kubernetes.io/name: borne-app, app.kubernetes.io/part-of: borne}
spec:
  replicas: 1                # SQLite = un seul écrivain : ne pas mettre à l'échelle horizontalement
  strategy:
    type: Recreate           # volume RWO : l'ancien pod doit libérer /data avant le nouveau
  selector:
    matchLabels: {app.kubernetes.io/name: borne-app}
  template:
    metadata:
      labels: {app.kubernetes.io/name: borne-app, app.kubernetes.io/part-of: borne}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: borne-simulator          # remplacé par kustomize (images:) avec le digest construit par la CI
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: borne-app-config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: borne-data}
---
apiVersion: v1
kind: Service
metadata:
  name: borne-app
  labels: {app.kubernetes.io/name: borne-app, app.kubernetes.io/part-of: borne}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: borne-app}
  ports:
    - {name: http, port: 80, targetPort: http}
