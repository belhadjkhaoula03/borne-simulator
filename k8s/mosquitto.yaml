apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence false
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels: {app.kubernetes.io/name: mosquitto, app.kubernetes.io/part-of: borne}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mosquitto}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mosquitto, app.kubernetes.io/part-of: borne}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.20
          ports:
            - {name: mqtt, containerPort: 1883}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /mosquitto/config/mosquitto.conf, subPath: mosquitto.conf, readOnly: true}
          readinessProbe:
            tcpSocket: {port: mqtt}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: mqtt}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: mosquitto-config}
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto            # => MQTT_HOST=mosquitto depuis le namespace
  labels: {app.kubernetes.io/name: mosquitto, app.kubernetes.io/part-of: borne}
spec:
  type: ClusterIP            # volontairement interne : le broker n'est pas exposé hors cluster
  selector: {app.kubernetes.io/name: mosquitto}
  ports:
    - {name: mqtt, port: 1883, targetPort: mqtt}
